name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Token parity with @articulink/brand
        run: npm run check:tokens

      - name: Unit tests
        run: npx vitest run

      - name: Accessibility tests
        run: npx vitest run --config vitest.a11y.config.ts

      - name: Build
        run: npm run build

      - name: Package contents sanity check
        run: npm pack --dry-run
